name = "costinghub-app-2026"
compatibility_date = "2024-06-21"
pages_build_output_dir = "dist"

[assets]
directory = "./dist"

[vars]
# Add your environment variables here in the Cloudflare Dashboard
# GEMINI_API_KEY = "your-key-here"
# DATABASE_URL = "your-supabase-url"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
